name: ci

on:
  # Branch-filtered on purpose: an unfiltered `push` alongside `pull_request`
  # runs every job TWICE on the same commit whenever a branch has a PR open.
  # PRs validate on the merge ref; main verifies post-merge. A branch with no
  # PR open gets no CI — open a draft PR to get it. NOTE: this also stops tag
  # pushes from triggering ci (nothing depends on that today: zero tags, no
  # release workflow); a future release workflow needs its own `tags:` trigger.
  push:
    branches: [main]
  pull_request:
  # Manual lever. During the 2026-08-06 Actions incident, webhook throttling
  # stopped push and pull_request events from creating runs at all, and without
  # this there was no way to ask for CI on a given commit — the only "runs" were
  # hours-stale queued ones the API simultaneously reported as completed.
  # Caveat that decides when this starts helping: GitHub only offers the manual
  # trigger for workflow files present on the DEFAULT branch, so this does
  # nothing until it reaches main. From there it runs against any ref:
  #   gh workflow run ci.yml --ref <branch>
  workflow_dispatch:

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build and test runtime-core
        run: mvn -B --no-transfer-progress clean verify

  sdk:
    # Builds connect-gateway against connect-library built from source. The spec
    # its codegen needs is vendored at third_party/connect-api/openapi.yaml, so
    # this job reaches no private repository and runs UNCONDITIONALLY on every
    # PR. It used to be gated on CONNECT_API_CODE_TOKEN, which was never
    # configured — so it skipped every real step while reporting success, and the
    # gateway tests (including the sanitizer drift guard) never ran in CI. See
    # third_party/connect-api/README.md for provenance, refresh and drift.
    runs-on: ubuntu-latest
    needs: core
    steps:
      - uses: actions/checkout@v4
        with:
          path: connector
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Checkout connect-sdk-demo (public; carries the verbatim SDK modules)
        uses: actions/checkout@v4
        with:
          repository: shawn-tsanet/connect-sdk-demo
          # Pinned deliberately: this job installs what it builds here, so an
          # unpinned default branch would let a push to another repo change what
          # our CI compiles. Bump as a reviewed change.
          ref: 9ef7107d3aa9f8a8b2b5f3321ddec4326be08d60
          path: connect-sdk-demo
      - name: Install connect-library (codegen reads the vendored spec)
        run: >
          mvn -B --no-transfer-progress -f connect-sdk-demo/pom.xml
          -pl connect-library -am install -DskipTests
          -Dconnect.openapi.spec=${{ github.workspace }}/connector/third_party/connect-api/openapi.yaml
      - name: Build connector with sdk profile
        run: mvn -B --no-transfer-progress -f connector/pom.xml -P sdk clean verify
