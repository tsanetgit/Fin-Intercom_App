name: ci

on:
  # Branch-filtered on purpose: an unfiltered `push` alongside `pull_request`
  # runs every job TWICE on the same commit whenever a branch has a PR open.
  # PRs validate on the merge ref; main verifies post-merge. A branch with no
  # PR open gets no CI — open a draft PR to get it. NOTE: this also stops tag
  # pushes from triggering ci (nothing depends on that today: zero tags, no
  # release workflow); a future release workflow needs its own `tags:` trigger.
  push:
    branches: [main]
  pull_request:
  # Manual lever. During the 2026-08-06 Actions incident, webhook throttling
  # stopped push and pull_request events from creating runs at all, and without
  # this there was no way to ask for CI on a given commit — the only "runs" were
  # hours-stale queued ones the API simultaneously reported as completed.
  # Caveat that decides when this starts helping: GitHub only offers the manual
  # trigger for workflow files present on the DEFAULT branch, so this does
  # nothing until it reaches main. From there it runs against any ref:
  #   gh workflow run ci.yml --ref <branch>
  workflow_dispatch:

# Least privilege for the workflow's GITHUB_TOKEN (#56). Nothing here needs more
# than checkout's implicit repo read (contents: read); the sdk job's package reads
# ride the separate PACKAGES_READ_TOKEN secret, which ignores these permissions.
permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build and test runtime-core
        run: mvn -B --no-transfer-progress clean verify

  sdk:
    # Builds connect-gateway against the PUBLISHED gateway-engine (Fin swap, #42):
    # the engine resolves from the Connect_Gateway registry and brings
    # connect-library transitively from the Connect_SDK registry. Needs a
    # read:packages token; a missing secret FAILS RED - this job's own history is
    # the receipt for why (its old CONNECT_API_CODE_TOKEN gate skipped every real
    # step while reporting success, and the gateway tests never ran).
    runs-on: ubuntu-latest
    needs: core
    steps:
      - name: Require the packages read token
        env:
          HAVE_TOKEN: ${{ secrets.PACKAGES_READ_TOKEN != '' }}
        run: |
          set -euo pipefail
          if [ "$HAVE_TOKEN" != "true" ]; then
            echo "::error::The PACKAGES_READ_TOKEN secret is not configured. The sdk job resolves gateway-engine and connect-library from GitHub Packages, which needs a classic PAT with read:packages AND repo scope while the source repos are private. Configure the secret and re-run."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: connector
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Maven settings for both package registries
        env:
          PACKAGES_READ_TOKEN: ${{ secrets.PACKAGES_READ_TOKEN }}
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml <<'XML'
          <settings><servers>
            <server><id>github</id><username>ci</username><password>${env.PACKAGES_READ_TOKEN}</password></server>
            <server><id>github-sdk</id><username>ci</username><password>${env.PACKAGES_READ_TOKEN}</password></server>
          </servers></settings>
          XML
      - name: Build connector with sdk profile
        env:
          PACKAGES_READ_TOKEN: ${{ secrets.PACKAGES_READ_TOKEN }}
        run: mvn -B --no-transfer-progress -f connector/pom.xml -P sdk clean verify
