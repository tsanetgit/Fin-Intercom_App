name: ci

on:
  # Branch-filtered on purpose: an unfiltered `push` alongside `pull_request`
  # runs every job TWICE on the same commit whenever a branch has a PR open.
  # PRs validate on the merge ref; main verifies post-merge. A branch with no
  # PR open gets no CI — open a draft PR to get it. NOTE: this also stops tag
  # pushes from triggering ci (nothing depends on that today: zero tags, no
  # release workflow); a future release workflow needs its own `tags:` trigger.
  push:
    branches: [main]
  pull_request:

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build and test runtime-core
        run: mvn -B --no-transfer-progress clean verify

  sdk:
    # Builds the connect-gateway module against connect-library built from source.
    # Connect-API-Code is private, so every real step is gated on the secret being
    # configured (the secrets context is not available in a job-level `if`).
    runs-on: ubuntu-latest
    needs: core
    steps:
      - name: Check for Connect-API-Code token
        id: gate
        env:
          TOKEN: ${{ secrets.CONNECT_API_CODE_TOKEN }}
        run: |
          if [ -n "$TOKEN" ]; then echo "has=true" >> "$GITHUB_OUTPUT"; else echo "has=false" >> "$GITHUB_OUTPUT"; echo "CONNECT_API_CODE_TOKEN not configured; skipping sdk profile build"; fi
      - uses: actions/checkout@v4
        if: steps.gate.outputs.has == 'true'
        with:
          path: connector
      - uses: actions/setup-java@v4
        if: steps.gate.outputs.has == 'true'
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Checkout connect-sdk-demo (public; carries the verbatim SDK modules)
        if: steps.gate.outputs.has == 'true'
        uses: actions/checkout@v4
        with:
          repository: shawn-tsanet/connect-sdk-demo
          path: connect-sdk-demo
      - name: Checkout Connect-API-Code on beta (codegen sibling; develop breaks codegen)
        if: steps.gate.outputs.has == 'true'
        uses: actions/checkout@v4
        with:
          repository: tsanetgit/Connect-API-Code
          ref: beta
          token: ${{ secrets.CONNECT_API_CODE_TOKEN }}
          path: Connect-API-Code
      - name: Install connect-library
        if: steps.gate.outputs.has == 'true'
        run: mvn -B --no-transfer-progress -f connect-sdk-demo/pom.xml -pl connect-library -am install -DskipTests
      - name: Build connector with sdk profile
        if: steps.gate.outputs.has == 'true'
        run: mvn -B --no-transfer-progress -f connector/pom.xml -P sdk clean verify
