# CI image build + push (#55): the deployable image is built from a commit in this
# repo and pushed with a scoped, secretless credential — OIDC federation to the
# Entra app fin-gateway-ci-push, which holds AcrPush on the registry and nothing
# else. No ACR admin credential is involved. The federated credential's subject is
# pinned to the `acr` environment (repo:tsanetgit/Fin-Intercom_App:environment:acr),
# which is what lets one credential cover main pushes, tag pushes, and manual
# dispatch: Entra federated credentials match subjects exactly, and per-ref
# subjects would need one credential per ref.
#
# Tags produced: sha-<short> always; the git tag name on tag builds. Every pushed
# image is then scanned (#58): a fixable CRITICAL or HIGH vulnerability in the base
# image's OS packages or in the jar's Java dependencies fails the job before the
# attestation step, so such a build is never deployable. Every build that passes
# the scan is attested (SLSA build provenance, signed by this workflow and stored
# on GitHub), and the deploy script deploys only a release-tag (vX.Y.Z) build: it
# verifies the attestation names this workflow, the tag's ref and the tag's commit,
# then pins the digest. Main builds, manual runs on a branch and other v* tag builds
# are attested too but never deployable (a manual run on a release tag rebuilds that
# tag from the same workflow and commit, and is deployable); the policy lives in the
# verifier. Tests are not run here: ci.yml runs them on the same commit; this
# workflow only assembles and ships the artifact (-DskipTests).
name: image
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  ACR: tsanetfinpoc

jobs:
  build-push:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: acr
    permissions:
      contents: read
      id-token: write # OIDC token for azure/login and the attestation's signing certificate
      attestations: write # store the build provenance attestation on GitHub
    steps:
      - name: Require the packages read token
        env:
          HAVE_TOKEN: ${{ secrets.PACKAGES_READ_TOKEN != '' }}
        run: |
          set -euo pipefail
          if [ "$HAVE_TOKEN" != "true" ]; then
            echo "::error::PACKAGES_READ_TOKEN is not configured; the -Psdk build resolves gateway-engine and connect-library from GitHub Packages. Fail red, never silently skip (same rule as ci.yml)."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Maven settings for both package registries
        env:
          PACKAGES_READ_TOKEN: ${{ secrets.PACKAGES_READ_TOKEN }}
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml <<'XML'
          <settings><servers>
            <server><id>github</id><username>ci</username><password>${env.PACKAGES_READ_TOKEN}</password></server>
            <server><id>github-sdk</id><username>ci</username><password>${env.PACKAGES_READ_TOKEN}</password></server>
          </servers></settings>
          XML
      - name: Build the exec jar
        env:
          # settings.xml defers to ${env.PACKAGES_READ_TOKEN} at Maven runtime, so
          # the variable must exist on THIS step (same shape as ci.yml's sdk job).
          PACKAGES_READ_TOKEN: ${{ secrets.PACKAGES_READ_TOKEN }}
        run: mvn -B --no-transfer-progress -Psdk -DskipTests package
      - name: Assert the jar carries the SDK gateway
        # Same marker as scripts/run-local.sh: a filename is not evidence. The
        # Dockerfile re-asserts with its own grep during the build; this fails
        # earlier and with a clearer message.
        run: |
          set -euo pipefail
          # Glob, not a hardcoded version: the Dockerfile's COPY globs the same way,
          # so a version bump cannot silently split the two.
          set -- connect-gateway/target/connect-gateway-*-exec.jar
          [ "$#" -eq 1 ] && [ -f "$1" ] || { echo "::error::expected exactly one connect-gateway exec jar, found: $*"; exit 1; }
          JAR="$1"
          unzip -l "$JAR" | grep -q "BOOT-INF/lib/gateway-engine-" \
            || { echo "::error::$JAR carries no gateway-engine artifact — wrong jar or a pre-swap build"; exit 1; }
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Build and push
        id: push
        run: |
          set -euo pipefail
          az acr login --name "$ACR"
          # HEAD after checkout: the commit the build context actually came from, which
          # the sha-<short> label must name (QA). On a tag push GITHUB_SHA is that same
          # commit, annotated tags included: the attestation certificate's source digest
          # carries GITHUB_SHA, and on tsanetgit/Zendesk_App's v1.0.71 (an annotated tag,
          # same push trigger) it names the commit, not the tag object. The deploy
          # script's --source-digest check relies on that.
          SHORT="$(git rev-parse --short=7 HEAD)"
          IMG="$ACR.azurecr.io/fin-gateway"
          docker build --platform linux/amd64 -t "$IMG:sha-$SHORT" .
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            docker tag "$IMG:sha-$SHORT" "$IMG:${GITHUB_REF_NAME}"
            docker push "$IMG:${GITHUB_REF_NAME}"
          fi
          docker push "$IMG:sha-$SHORT"
          # Filter by repo rather than trusting RepoDigests[0]: single-repo today, but
          # the ordering was an unasserted assumption (QA), and the filter also fails
          # loudly if no digest for OUR repo exists at all.
          DIGEST="$(docker inspect --format '{{range .RepoDigests}}{{println .}}{{end}}' "$IMG:sha-$SHORT" | grep -m1 "^$IMG@" || true)"
          [ -n "$DIGEST" ] || { echo "::error::no repo digest for $IMG after push"; exit 1; }
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          # The attestation's subject is the bare sha256:... digest; DIGEST is repo@digest.
          echo "subject-digest=${DIGEST#*@}" >> "$GITHUB_OUTPUT"
          {
            echo "## Image pushed"
            echo '```'
            echo "$DIGEST"
            echo '```'
            # Same tag form the deploy script accepts.
            if [ "${GITHUB_REF_TYPE}" = "tag" ] && [[ "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Deploy it, once the scan and attestation steps below have succeeded, with: scripts/azure-poc-deploy.sh ${GITHUB_REF_NAME}"
            else
              echo "Not deployable: the deploy script takes only release-tag (vX.Y.Z) builds."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Install Trivy
        # Pinned by version and by the SHA-256 of the release tarball, fetched from the
        # GitHub release and checked before anything runs; a mismatch fails the job
        # here. The project's own installer (aquasecurity/setup-trivy, which
        # aquasecurity/trivy-action wraps) downloads from get.trivy.dev, which stopped
        # resolving on 2026-11-03 (aquasecurity/setup-trivy#42), and a wrapper action
        # would also run third-party composite steps inside this job, which holds the
        # OIDC signing identity and an AcrPush session. A hash-pinned binary is the
        # smaller trust. Bump TRIVY_VERSION and TRIVY_SHA256 together, from
        # trivy_<version>_checksums.txt on the release.
        env:
          TRIVY_VERSION: 0.70.0
          TRIVY_SHA256: 8b4376d5d6befe5c24d503f10ff136d9e0c49f9127a4279fd110b727929a5aa9
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 -o /tmp/trivy.tgz \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          echo "${TRIVY_SHA256}  /tmp/trivy.tgz" | sha256sum -c -
          mkdir -p "$HOME/.local/bin"
          tar -xzf /tmp/trivy.tgz -C "$HOME/.local/bin" trivy
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/trivy" --version
      - name: Cache key for the Trivy databases
        id: today
        run: echo "date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
      - name: Cache the Trivy vulnerability databases
        # trivy-db (~130 MB) and trivy-java-db (~950 MB) come from Trivy's default
        # mirrors with no credential. One cache entry per day; trivy refreshes a
        # stale DB on its own, so a restore from an older day still works.
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/trivy
          key: trivy-db-${{ steps.today.outputs.date }}
          restore-keys: trivy-db-
      - name: Scan the image for fixable CRITICAL and HIGH vulnerabilities
        # #58 box 2. Scans the image just pushed, by the same repo@digest the
        # attestation names: the base image's OS packages (ubuntu, from
        # eclipse-temurin:21-jre) and the Java dependencies nested in /app.jar. A
        # fixable CRITICAL or HIGH fails this step, so the attestation below never
        # runs and the deploy script refuses the build; the image stays in the
        # registry for triage. Unfixed findings are excluded (--ignore-unfixed):
        # nothing in this repo can remedy them. Trivy resolves the digest from the
        # local daemon (docker records RepoDigests on push), so no pull. Baseline
        # when this landed (2026-11-04): zero fixable CRITICAL/HIGH on a fresh main
        # build and on v0.3.0.
        env:
          IMAGE_DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          trivy image --scanners vuln --severity CRITICAL,HIGH --ignore-unfixed \
            --exit-code 1 --format table --timeout 10m "$IMAGE_DIGEST"
      - name: Attest build provenance
        # No push-to-registry: the deploy script verifies with gh, which reads the
        # attestation from GitHub, so a registry copy would have no consumer.
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.ACR }}.azurecr.io/fin-gateway
          subject-digest: ${{ steps.push.outputs.subject-digest }}
