server:
  port: 8792

connector:
  # fake = fixture gateway (dev/test); sdk = Connect SDK gateway (needs the
  # connect-gateway module on the classpath). The fake refuses to start under the prod
  # profile, and sdk mode refuses to start half-configured. The sdk block binds only
  # when mode=sdk; empty values otherwise stay inert.
  tsanet:
    mode: fake
  # fake = fixture Intercom gateway (dev/test); rest = real Intercom API (annotation
  # pipeline). The fake refuses the prod profile; rest mode fails fast without a token.
  inbound:
    # The Back-office ticket type that carries the TSANet attributes (token, partner,
    # respond-by). PER WORKSPACE — the dev workspace's id is not the pilot's — so it
    # has no default: unset means inbound cases are REFUSED rather than created as the
    # wrong type, and the refusal is an error-level tsanet_audit line.
    collaboration-ticket-type-id: ${INTERCOM_COLLABORATION_TICKET_TYPE_ID:}
    # Reconciliation poller. Push is a single attempt from our side (intake answers 200
    # on every branch so TSANet never redelivers), so this is what turns a lost event
    # into a late case instead of a lost one. ON by default: an operator who never heard
    # of it should get the recovery, not silently lose it.
    reconcile-enabled: ${CONNECTOR_RECONCILE_ENABLED:true}
    # fixedDelay, measured from the END of the previous cycle, so cycles cannot overlap.
    reconcile-interval-ms: ${CONNECTOR_RECONCILE_INTERVAL_MS:300000}
    # Lets the app finish booting, and keeps a crash-loop from hammering the list API.
    reconcile-initial-delay-ms: ${CONNECTOR_RECONCILE_INITIAL_DELAY_MS:60000}
    # First-run window when there is no stored cursor. The list endpoint has NO
    # pagination, so this is the only load control; never unbounded.
    reconcile-lookback: ${CONNECTOR_RECONCILE_LOOKBACK:24h}
    # Subtracted from the stored cursor every query. updatedAt mixes granularity
    # (creation sub-second, the server's SLA sweep whole-second) and the filter boundary
    # is unspecified; a re-listed case is free, a missed one is not.
    reconcile-overlap: ${CONNECTOR_RECONCILE_OVERLAP:120s}
    # The ticket state a partner-closed case moves to (D17). PER WORKSPACE, like the
    # ticket type, and NOT conveniently discoverable: state ids are only enumerable
    # under `Intercom-Version: Unstable`, so resolve it out of band and set it here.
    # Unset means inbound closure is refused rather than guessed — a wrong id may move
    # the ticket to some unrelated state instead of failing.
    # Illustrative values from one dev workspace (every workspace differs): type 4000001:
    # Submitted 9000001, In progress 9000002, Waiting on customer 9000003, Resolved 9000004.
    resolved-state-id: ${INTERCOM_RESOLVED_STATE_ID:}
    # The two NON-terminal targets in D17's mapping, surfaced by partner responses
    # (tsanetgit/Fin-Intercom_App#45): In progress = a partner accepted, Waiting on
    # customer = a partner asked us for more information. Same species as
    # resolved-state-id: per-workspace, resolved out of band, and an unset id refuses
    # only the statuses that need it (each refusal is its own error-level audit line).
    in-progress-state-id: ${INTERCOM_IN_PROGRESS_STATE_ID:}
    waiting-state-id: ${INTERCOM_WAITING_STATE_ID:}

  intercom:
    mode: fake
    access-token: ${INTERCOM_ACCESS_TOKEN:${INTERCOM_DEV_ACCESS_TOKEN:}}
    admin-id: ${INTERCOM_ADMIN_ID:}   # blank = resolved once via GET /me at wiring
    api-base-url: https://api.intercom.io
  # memory = volatile map table (dev/test; refused under the prod profile); sqlite =
  # durable file store. Links are the only route home for an open case, so a restart on
  # the memory store orphans every one of them (docs/decisions.md D10, D12). The file
  # must sit on storage that outlives the container - the boot log prints its absolute
  # path so a mis-mounted volume is visible rather than silent.
  links:
    store: ${CONNECTOR_LINKS_STORE:memory}
    sqlite-path: ${CONNECTOR_LINKS_SQLITE_PATH:data/links.db}
  # Empty secrets fail closed (401) on the signed endpoints; /healthz stays open.
  intercom-client-secret: ${INTERCOM_DEV_CLIENT_SECRET:}
  tsanet-webhook-secret: ${TSANET_WEBHOOK_SECRET:${TSANET_BETA_WEBHOOK_SECRET:}}
  # Admin plane (Connect_Gateway docs/admin-contract.md v1; docs/decisions.md D20).
  # Blank admin secret = every /admin/* request answers 401 (fail closed): an instance
  # with no admin secret serves no admin plane. This is the console<->adapter secret,
  # never a member credential. public-base-url feeds /admin/urls; unset falls back to
  # the request's X-Forwarded-Proto/Host, then Host.
  admin-api-secret: ${CONNECTOR_ADMIN_API_SECRET:}
  public-base-url: ${CONNECTOR_PUBLIC_BASE_URL:}
  max-body-bytes: 1048576
  dedupe-capacity: 10000
  queue-capacity: 10000
  # Hardened profile (#65): true refuses new outbound collaborations from plain
  # conversations (tickets-only mode). Deploy-time, per deployment, default off.
  tickets-only: ${CONNECTOR_TICKETS_ONLY:false}
  # SDK operational cache retention (#66): connect-sdk.db caches case content
  # (summaries, note text, response details, raw webhook payloads) with no upstream
  # eviction. Blank = OFF, and the sweep bean does not even register (a template's
  # empty env var stays off). Member opt-in per the connector-features convention.
  # Durations parse in simple style ("30d", "720h") and ISO-8601, matching
  # reconcile-lookback above. Terminal cases (CLOSED/REJECTED) and their note/
  # response/attachment-config rows older than the window are evicted; OPEN cases
  # never age out. attachment_forward_result is never evicted (no API read-back
  # path) and children with no cached parent are never age-swept either
  # (connect-library's CacheRetention, connect-gateway/.../sdk/SdkCacheRetentionSweep).
  sdk-cache:
    retention: ${CONNECTOR_SDK_CACHE_RETENTION:}
    sweep-interval: ${CONNECTOR_SDK_CACHE_SWEEP_INTERVAL:PT6H}
    sweep-initial-delay: ${CONNECTOR_SDK_CACHE_SWEEP_INITIAL_DELAY:PT10M}

# The published gateway engine binds gateway.tsanet.* (the canonical prefix from
# the extraction). mode bridges from connector.tsanet.mode so the operator surface
# - env var names, run scripts, the deploy template - is unchanged by the Fin swap
# (#42). The sdk block moved here verbatim; it binds only when mode=sdk.
gateway:
  tsanet:
    mode: ${connector.tsanet.mode:fake}
    sdk:
      api-base-url: ${TSANET_API_URL:}
      auth-mode: ${TSANET_AUTH_MODE:password}   # password | client_credentials
      principal: ${TSANET_API_USER:}            # username/email, or Entra client id
      secret: ${TSANET_API_PASSWORD:}           # password, or Entra client secret
      entra-tenant-id: ${TSANET_ENTRA_TENANT_ID:}
      entra-audience: ${TSANET_ENTRA_AUDIENCE:}
      sqlite-path: ${TSANET_SDK_SQLITE_PATH:data/connect-sdk.db}
      # test-submission defaults TRUE: real partner cases are a per-deployment opt-in
      # at pilot time (the upstream facade hardcodes true - connect-sdk-demo#6).
      test-submission: ${TSANET_TEST_SUBMISSION:true}
