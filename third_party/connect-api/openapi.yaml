          format: int32

    WebhookPayloadVersion:
      type: string
      enum:
        - V1
        - V2
      default: V1
      description: |
        Payload format version for webhook deliveries. See the Connect Webhook Events
        AsyncAPI specification for full payload and header details per version.
        - **V1** (default): Legacy flat JSON. Only `collaboration-request.created` and `note.created` are delivered.
        - **V2**: CloudEvents 1.0 structured binding. All 5 event types are delivered.

