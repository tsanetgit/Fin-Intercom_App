  /v1/webhooks/{id}/secret:
    post:
      tags:
        - Webhooks
      summary: Rotate the HMAC signing secret for a webhook subscription
      description: |
        Generates a new HMAC-SHA256 secret for the subscription. The new secret is returned
        in the response and is **only returned once** — store it immediately.

        After rotation, deliveries will be signed with the new secret. Allow a short overlap
        window before decommissioning the old secret on the consumer side.
      operationId: rotateWebhookSecret
      parameters:
        - name: id
