components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Paste a Bearer JWT here. Two token types are accepted:

        **Connect1 User Tokens** — issued by the Connect1 identity service. Copy the token from your Connect1 session.

        **Azure AD M2M** — use the `azureClientCredentials` scheme below to get a token, then paste it here.
    azureClientCredentials:
      type: oauth2
      description: |
        Azure AD client credentials (M2M) for server-to-server integrations.
        Your service principal must be provisioned by TSANet before tokens will be accepted — contact TSANet with your service principal OID.

        The Authorize button cannot complete this flow due to browser CORS restrictions. Get a token with curl instead:
        ```
        curl -X POST https://login.microsoftonline.com/{tenant-id}/oauth2/v2.0/token \
          -d "grant_type=client_credentials" \
          -d "client_id={client-id}" \
          -d "client_secret={client-secret}" \
          -d "scope=api://{audience}/.default"
        ```
        Copy the `access_token` from the response and paste it into the **bearerAuth** field above.
      flows:
        clientCredentials:
          tokenUrl: https://login.microsoftonline.com/{tenant-id}/oauth2/v2.0/token
          scopes:
            api://{audience}/.default: Full API access

  schemas:
    CollaborationRequestType:
      type: string
      enum:
        - ALL
        - INBOUND
        - OUTBOUND
      default: ALL

    CollaborationRequestStatus:
      type: string
      enum:
        - ALL
        - OPEN
        - INFORMATION
        - REJECTED
        - ACCEPTED
        - CLOSED
        - PENDINGACTION
      default: ALL

    # Authentication DTOs
    LoginRequestDTO:
      type: object
      required:
        - username
        - password
      properties:
        username:
          type: string
          maxLength: 191
          description: Username for authentication
        password:
          type: string
          format: password
          maxLength: 191
          description: Password for authentication

    TokenDTO:
      type: object
      properties:
        accessToken:
          type: string
          description: JWT access token
        tokenType:
          type: string
        expiresIn:
          type: integer
          format: int32

    UserContextDTO:
      type: object
      properties:
        company:
          "$ref": "#/components/schemas/CompanyDTO"
        user:
          "$ref": "#/components/schemas/UserDTO"

    CollaborationRequestDTO:
      type: object
      required:
        - customFields
        - internalCaseNumber
        - problemSummary
        - problemDescription
        - documentId
        - priority
        - internalNotes
        - testSubmission
      properties:
        documentId:
          type: integer
          format: int64
        internalCaseNumber:
          type: string
          maxLength: 191
        receiverInternalCaseNumber:
          type: string
          maxLength: 191
        problemSummary:
          type: string
          maxLength: 500
        problemDescription:
          type: string
          maxLength: 10000
        priority:
          $ref: "#/components/schemas/CasePriority"
        adminNote:
          type: string
          maxLength: 2000
        escalationInstructions:
          type: string
          maxLength: 2000
        submitterContactDetails:
          $ref: "#/components/schemas/ContactDetailsDTO"
          description: Contact details of the engineer submitting the collaboration request
        customFields:
          type: array
          items:
            "$ref": "#/components/schemas/FieldMetadataDTO"
        internalNotes:
          type: array
          items:
            "$ref": "#/components/schemas/InternalNoteDTO"
        testSubmission:
          type: boolean

    CollaborationRequestStatusDTO:
      type: object
      properties:
        id:
          type: integer
          format: int64
        submitCompanyName:
          type: string
          maxLength: 191
        submitCompanyId:
          type: integer
          format: int64
        submitterCaseNumber:
          type: string
          maxLength: 191
        receiveCompanyName:
          type: string
          maxLength: 191
        receiveCompanyId:
          type: integer
          format: int64
        receiverCaseNumber:
          type: string
          maxLength: 191
        summary:
          type: string
          maxLength: 500
        description:
          type: string
          maxLength: 10000
        direction:
          $ref: "#/components/schemas/CollaborationRequestDirection"
        priority:
          $ref: "#/components/schemas/CasePriority"
        status:
          $ref: "#/components/schemas/CaseStatus"
        token:
          type: string
          maxLength: 20
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        deletedAt:
          type: string
          format: date-time
        responded:
          type: boolean
        respondBy:
          type: string
          format: date-time
        feedbackRequested:
          type: boolean
        reminderSent:
          type: boolean
        priorityNote:
          type: string
          maxLength: 2000
        escalationInstructions:
          type: string
          maxLength: 2000
        contactDocumentId:
          type: integer
          format: int64
          description: ID of the contact document used to create this case
        contactDocumentName:
          type: string
          maxLength: 191
          description: Name of the contact document used to create this case
        testCase:
          type: boolean
        customFields:
          type: array
          items:
            $ref: "#/components/schemas/CaseCustomFieldStatusDTO"
        submittedBy:
          $ref: "#/components/schemas/UserDTO"
        submitterContactDetails:
          $ref: "#/components/schemas/ContactDetailsDTO"
        receiverContactDetails:
          $ref: "#/components/schemas/ContactDetailsDTO"
        caseNotes:
          type: array
          items:
            $ref: "#/components/schemas/CaseNoteDTO"
        caseResponses:
          type: array
          items:
            $ref: "#/components/schemas/CaseResponseDTO"

    ContactDetailsDTO:
      type: object
      required:
        - name
        - email
        - phone
      properties:
        name:
          type: string
          maxLength: 191
          description: Full name of the contact
        email:
          type: string
          format: email
          maxLength: 191
          description: Email address of the contact
        phone:
          type: string
          maxLength: 50
          description: Phone number of the contact

    CollaborationRequestSubmitterUpdateDTO:
      type: object
      properties:
        internalCaseNumber:
          type: string
          nullable: true
          maxLength: 255
          description: Internal case number for the submitter's tracking system
        submitterContactDetails:
          $ref: "#/components/schemas/ContactDetailsDTO"
          description: Updated contact details for the submitter engineer

    # Case Response DTOs
    CaseApprovalUpdateDTO:
      type: object
      properties:
        caseNumber:
          type: string
          maxLength: 191
          nullable: true
        engineerName:
          type: string
          maxLength: 191
          nullable: true
        engineerPhone:
          type: string
          maxLength: 50
          nullable: true
        engineerEmail:
          type: string
          format: email
          maxLength: 191
          nullable: true
        nextSteps:
          type: string
          maxLength: 5000
          nullable: true

    CaseApprovalDTO:
      type: object
      required:
        - caseNumber
        - engineerName
        - engineerEmail
        - nextSteps
      properties:
        caseNumber:
          type: string
          maxLength: 191
        engineerName:
          type: string
          maxLength: 191
        engineerPhone:
          type: string
          maxLength: 50
        engineerEmail:
          type: string
          format: email
          maxLength: 191
        nextSteps:
          type: string
          maxLength: 5000

    CaseInformationRequestDTO:
      type: object
      required:
        - engineerName
        - engineerEmail
        - requestedInformation
      properties:
        engineerName:
          type: string
          maxLength: 191
        engineerPhone:
          type: string
          maxLength: 50
        engineerEmail:
          type: string
          format: email
          maxLength: 191
        requestedInformation:
          type: string
          maxLength: 5000

    CaseInformationResponseDTO:
      type: object
      required:
        - requestedInformation
      properties:
        requestedInformation:
          type: string
          maxLength: 5000

    CaseRejectionDTO:
      type: object
      required:
        - engineerName
        - engineerEmail
        - reason
      properties:
        engineerName:
          type: string
          maxLength: 191
        engineerPhone:
          type: string
          maxLength: 50
        engineerEmail:
          type: string
          format: email
          maxLength: 191
        reason:
          type: string
          maxLength: 2000

    # Notes DTOs
    CaseNoteDTO:
      type: object
      properties:
        id:
          type: integer
          format: int64
        caseId:
          type: integer
          format: int64
        companyName:
          type: string
          maxLength: 191
        creatorUsername:
          type: string
          maxLength: 191
        creatorEmail:
          type: string
          maxLength: 191
        creatorName:
          type: string
          maxLength: 191
        summary:
          type: string
          maxLength: 500
        description:
          type: string
          maxLength: 5000
        priority:
            $ref: "#/components/schemas/NotePriority"
        status:
            $ref: "#/components/schemas/NoteStatus"
        token:
          type: string
          maxLength: 20
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CaseNoteTemplateDTO:
      required:
        - description
        - priority
        - summary
      type: object
      properties:
        summary:
          type: string
          maxLength: 500
        description:
          type: string
          maxLength: 5000
        priority:
          "$ref": "#/components/schemas/NotePriority"
        submittedBy:
          "$ref": "#/components/schemas/UserDTO"

    # Attachment DTOs
    AttachmentConfigDTO:
      type: object
      properties:
        submitter:
          "$ref": "#/components/schemas/CompanyAttachmentConfigDTO"
        receiver:
          "$ref": "#/components/schemas/CompanyAttachmentConfigDTO"

    CompanyAttachmentConfigDTO:
      type: object
      properties:
        companyId:
          type: integer
          format: int64
        parameters:
          type: object
          additionalProperties:
            type: object

    NormalizedHttpsAttachmentConfigDTO:
      required:
        - domain
        - expiration
        - httpsPath
        - httpsPort
        - password
      type: object
      properties:
        domain:
          pattern: "^([a-zA-Z0-9]([a-zA-Z0-9\\-]{0,61}[a-zA-Z0-9])?\\.)+[a-zA-Z]{2,}$"
          type: string
        password:
          type: string
        expiration:
          type: string
          format: date-time
        httpsPath:
          pattern: "^(/[^/ ]*)+/?$"
          type: string
        httpsPort:
          maximum: 65535
          minimum: 1
          type: integer
          format: int32

    AttachmentForwardResultDTO:
      type: object
      properties:
        fileName:
          type: string
          maxLength: 255
        receiverStatus:
            "$ref": "#/components/schemas/AttachmentForwardResultStatus"
        receiverMessage:
          type: string
          maxLength: 1000
        submitterStatus:
          "$ref": "#/components/schemas/AttachmentForwardResultStatus"
        submitterMessage:
          type: string
          maxLength: 1000
        completeSuccess:
          type: boolean
        partialSuccess:
          type: boolean

    # Partner DTOs
    PartnerSelectionDTO:
      type: object
      properties:
        label:
          type: string
          maxLength: 191
        companyName:
          type: string
          maxLength: 191
        departmentName:
          type: string
          maxLength: 191
        companyId:
          type: integer
          format: int64
        departmentId:
          type: integer
          format: int64
        documentId:
          type: integer
          format: int64
        tags:
          type: array
          items:
            "$ref": "#/components/schemas/TagDTO"

    PartnerSearchResultDTO:
      type: object
      description: Result from semantic partner search with relevance scoring
      properties:
        companyId:
          type: integer
          format: int64
          description: Company identifier
        departmentId:
          type: integer
          format: int64
          description: Department identifier (null for company-level results)
        companyName:
          type: string
          maxLength: 191
          description: Company name
        departmentName:
          type: string
          maxLength: 191
          description: Department name (null for company-level results)
        score:
          type: number
          format: double
          description: Relevance score (0.0 to 1.0, higher is better)
        snippet:
          type: string
          maxLength: 1000
          description: Preview of the matched content
        displayName:
          type: string
          maxLength: 191
          description: Formatted display name (company - department or just company)
      required:
        - companyId
        - companyName
        - score

    HealthDTO:
      type: object
      properties:
        status:
          type: string

    TagDTO:
      type: object
      properties:
        tag:
          type: string
          maxLength: 191

    # Supporting DTOs
    FieldMetadataDTO:
      type: object
      required:
        - fieldId
        - section
        - label
        - type
        - displayOrder
        - required
      properties:
        fieldId:
          type: integer
          format: int64
        section:
          "$ref": "#/components/schemas/FieldMetadataSection"
        label:
          type: string
          maxLength: 191
        options:
          type: string
          maxLength: 5000
        additionalSettings:
          type: string
          maxLength: 5000
        type:
            "$ref": "#/components/schemas/FieldMetadataType"
        displayOrder:
          type: integer
          format: int32
        validationRules:
          type: string
          maxLength: 1000
        value:
          type: string
          maxLength: 5000
        selections:
          type: array
          items:
            "$ref": "#/components/schemas/SelectionDTO"
        required:
          type: boolean

    SelectionDTO:
      type: object
      properties:
        value:
          type: string
          maxLength: 191
        children:
          uniqueItems: true
          type: array
          items:
            "$ref": "#/components/schemas/SelectionDTO"

    InternalNoteDTO:
      type: object
      properties:
        note:
          type: string
          maxLength: 5000

    CaseCustomFieldStatusDTO:
      type: object
      properties:
        id:
          type: integer
          format: int64
        section:
          "$ref": "#/components/schemas/FieldMetadataSection"
        fieldName:
          type: string
          maxLength: 191
        value:
          type: string
          maxLength: 5000
        displayOrder:
          type: integer
          format: int32
        type:
            "$ref": "#/components/schemas/FieldMetadataType"

    UserDTO:
      type: object
      properties:
        id:
          type: integer
          format: int64
        username:
          type: string
          maxLength: 191
        firstName:
          type: string
          maxLength: 191
        lastName:
          type: string
          maxLength: 191
        email:
          type: string
          maxLength: 191
        phone:
          type: string
          maxLength: 50
        phoneCountryCode:
          type: string
          maxLength: 10
        city:
          type: string
          maxLength: 191
        emailCheckFailData:
          type: string
          maxLength: 191

    CompanyDTO:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
          maxLength: 191
        description:
          type: string
          maxLength: 5000
        domain:
          type: string
          maxLength: 191

    WebhookCallbackAuthType:
      type: string
      enum:
        - NONE
        - BASIC
        - BEARER
        - HEADER
      description: Authentication type to use when TSANet delivers events to the callback URL.

    WebhookCallbackAuthDTO:
      type: object
      required:
        - type
      properties:
        type:
          $ref: '#/components/schemas/WebhookCallbackAuthType'
        username:
          type: string
          description: Required when type is BASIC.
        password:
          type: string
          writeOnly: true
          description: Required when type is BASIC.
        token:
          type: string
          writeOnly: true
          description: Required when type is BEARER.
        headerName:
          type: string
          description: Required when type is HEADER. The name of the custom header to send.
        headerValue:
          type: string
          writeOnly: true
          description: Required when type is HEADER. The value of the custom header to send.

    WebhookEventType:
      type: string
      enum:
        - collaboration-request.created
        - note.created
      description: |
        V1 webhook event type short names. Only `collaboration-request.created` and `note.created`
        are delivered via V1 subscriptions. For the full set of 5 event types, use
        `POST /v2/webhooks` with `WebhookEventTypeV2` strings.

    WebhookEventTypeV2:
      type: string
      enum:
        - org.tsanet.connect.collaboration-request.created
        - org.tsanet.connect.collaboration-request.closed
        - org.tsanet.connect.collaboration-request.note.created
        - org.tsanet.connect.collaboration-request.response.created
        - org.tsanet.connect.collaboration-request.response.updated
      description: |
        V2 CloudEvent type strings for webhook subscriptions. These match the `type` field
        in delivered CloudEvent payloads exactly.

    CreateWebhookSubscriptionRequestDTO:
      type: object
      required:
        - callbackUrl
      properties:
        callbackUrl:
          type: string
          format: uri
          description: The URL to receive webhook events. Must be accessible via HTTPS in production.
          example: "https://api.example.com/webhooks/tsanet"
        eventTypes:
          type: array
          items:
            $ref: '#/components/schemas/WebhookEventType'
          description: |
            Optional list of V1 event types to subscribe to. If empty or null, both
            `collaboration-request.created` and `note.created` are delivered.
          example: ["collaboration-request.created", "note.created"]
        callbackAuth:
          $ref: '#/components/schemas/WebhookCallbackAuthDTO'
          description: |
            Optional credential TSANet will attach to every delivery POST, in addition to the
            existing HMAC-SHA256 signature. If omitted, deliveries are unauthenticated (current
            behaviour). Requires callbackUrl to be HTTPS when type is not NONE.

    CreateWebhookSubscriptionV2RequestDTO:
      type: object
      required:
        - callbackUrl
      properties:
        callbackUrl:
          type: string
          format: uri
          description: The URL to receive webhook events. Must be accessible via HTTPS in production.
          example: "https://api.example.com/webhooks/tsanet"
        eventTypes:
          type: array
          items:
            $ref: '#/components/schemas/WebhookEventTypeV2'
          description: |
            Optional list of CloudEvent type strings to subscribe to. If empty or null, all
            5 event types are delivered. Values must match `WebhookEventTypeV2` exactly.
          example: ["org.tsanet.connect.collaboration-request.created", "org.tsanet.connect.collaboration-request.note.created"]
        callbackAuth:
          $ref: '#/components/schemas/WebhookCallbackAuthDTO'
          description: |
            Optional credential TSANet will attach to every delivery POST, in addition to the
            existing HMAC-SHA256 signature. If omitted, deliveries are unauthenticated.

    WebhookSubscriptionResponseDTO:
      type: object
      properties:
        id:
          type: integer
          format: int64
        callbackUrl:
          type: string
          maxLength: 500
        eventTypes:
          type: array
          items:
            $ref: '#/components/schemas/WebhookEventType'
        payloadVersion:
          $ref: '#/components/schemas/WebhookPayloadVersion'
        active:
          type: boolean
        secret:
          type: string
          maxLength: 64
          description: HMAC secret for signing webhooks (only returned on creation — use POST /v1/webhooks/{id}/secret to rotate)
        callbackAuthType:
          type: string
          description: The authentication type configured for this subscription. Credential values are never returned.
          example: "BASIC"
        createdAt:
          type: string
          format: date-time

    WebhookSecretRotationResponseDTO:
      type: object
      properties:
        id:
          type: integer
          format: int64
          description: Webhook subscription ID
        secret:
          type: string
          maxLength: 64
          description: |
            New HMAC-SHA256 signing secret. This value is only returned once.
            Store it immediately — it cannot be retrieved again.
        rotatedAt:
          type: string
          format: date-time
          description: Timestamp when the secret was rotated

    WebhookSubscriptionDTO:
      type: object
      properties:
        id:
          type: integer
          format: int64
        callbackUrl:
          type: string
          maxLength: 500
        eventTypes:
          type: array
          items:
            $ref: '#/components/schemas/WebhookEventType'
        payloadVersion:
          $ref: '#/components/schemas/WebhookPayloadVersion'
        active:
          type: boolean
        callbackAuthType:
          type: string
          description: The authentication type configured for this subscription. Credential values are never returned.
          example: "BASIC"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    WebhookSubscriptionV2ResponseDTO:
      type: object
      properties:
        id:
          type: integer
          format: int64
        callbackUrl:
          type: string
          maxLength: 500
        eventTypes:
          type: array
          items:
            $ref: '#/components/schemas/WebhookEventTypeV2'
        active:
          type: boolean
        secret:
          type: string
          maxLength: 64
          description: HMAC secret for signing webhooks (only returned on creation — use POST /v1/webhooks/{id}/secret to rotate)
        callbackAuthType:
          type: string
          description: The authentication type configured for this subscription. Credential values are never returned.
          example: "BASIC"
        createdAt:
          type: string
          format: date-time

    WebhookSubscriptionV2DTO:
      type: object
      properties:
        id:
          type: integer
          format: int64
        callbackUrl:
          type: string
          maxLength: 500
        eventTypes:
          type: array
          items:
            $ref: '#/components/schemas/WebhookEventTypeV2'
        active:
          type: boolean
        callbackAuthType:
          type: string
          description: The authentication type configured for this subscription. Credential values are never returned.
          example: "BASIC"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    WebhookDeliveryLogDTO:
      type: object
      properties:
        id:
          type: integer
          format: int64
        cloudEventId:
          type: string
          maxLength: 100
        eventType:
          type: string
          maxLength: 50
        httpStatus:
          type: integer
          format: int32
        attemptNumber:
