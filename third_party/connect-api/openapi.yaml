      summary: Semantic search for collaboration partners
      description: |
        Search for partners using natural language queries. This endpoint uses AI-powered 
        semantic search to understand the intent of your query and find relevant partners 
        based on their capabilities, technologies, industries, and descriptions.
        
        Only returns partners that are interactable based on your community access.
        
