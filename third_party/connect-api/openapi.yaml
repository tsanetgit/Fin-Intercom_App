openapi: 3.0.3
info:
  title: TSANet Connect Core API
  version: 1.0.0
  description: |
    Core business API for the TSANet Connect platform. This API provides endpoints for:
    - Authentication and user management
    - Collaboration request management (cases)
    - Case responses (approval, rejection, information requests)
    - Notes management
    - Attachment configuration
    - Partner search
    - Form requests
  contact:
    name: Andrew DuLac
    email: andrew@appko.com

servers:
  - url: http://localhost:8080
    description: Local
  - url: https://connect2.tahoelab.us
    description: Dev
  - url: https://connect2.tsanet.net
    description: Beta
  - url: https://connect2.tsanet.org
    description: Prod

security:
  - bearerAuth: []

tags:
  - name: Identity
    description: Authentication and user management
  - name: Collaboration Requests
    description: Case creation, retrieval, and management
  - name: Case Responses
    description: Approve, reject, and respond to cases
  - name: Case Notes
    description: Notes associated with collaboration requests
  - name: Case Attachments
    description: Attachment configuration and forwarding
  - name: Entity Search
    description: Partner and entity search functionality
  - name: Form Request
    description: Form templates for collaboration requests
  - name: WebhooksV1
    description: V1 webhook subscriptions (legacy flat JSON — collaboration-request.created and note.created only)
  - name: WebhooksV2
    description: V2 webhook subscriptions (CloudEvents 1.0 — all 5 event types)
  - name: Webhooks
    description: Webhook subscription management (delete, secret rotation, delivery log)
  - name: Health
    description: Service health and availability

paths:
  /v1/health:
    get:
      tags:
        - Health
      summary: Health check
      operationId: getHealth
      responses:
        "200":
          description: Service is up
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthDTO"
      security: []

  # Authentication endpoints
  /v1/login:
    post:
      tags:
        - Identity
      summary: Login to the API
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequestDTO"
      responses:
        "200":
          description: Successful login
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenDTO"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
      security: []
      
  /v1/me:
    get:
      tags:
        - Identity
      summary: Get current user information
      operationId: getCurrentUser
      responses:
        "200":
          description: Current user information
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserContextDTO"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"

  # Collaboration Requests endpoints
  /v1/collaboration-requests:
    post:
      tags:
        - Collaboration Requests
      summary: Create a new collaboration request
      operationId: createCollaborationRequest
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CollaborationRequestDTO"
      responses:
        "200":
          description: Collaboration request created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CollaborationRequestStatusDTO"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "403":
          description: Access denied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"

    get:
      tags:
        - Collaboration Requests
      summary: Get collaboration requests
      deprecated: true
      x-sunset: "2027-01-01"
      description: |
        **Deprecated** — use `GET /v2/collaboration-requests` instead.
        This endpoint will be removed after 2027-01-01.
      operationId: getCollaborationRequests
      parameters:
        - name: internalCaseNumber
          in: query
          required: false
          description: Your internal case number
          schema:
            type: string
        - name: type
          in: query
          required: false
          description: Filter by collaboration requests type (optional) - all by default
          schema:
            type: string
            default: ALL
        - name: status
          in: query
          required: false
          description: Filter by collaboration requests status (optional) - all by default
          schema:
            type: string
            default: ALL
        - name: updatedAfter
          in: query
          required: false
          description: Filter by collaboration requests that were updated after (YYYY-MM-DDTHH:MM:SSZ)
          schema:
            type: string
            format: date-time
        - name: createdAfter
          in: query
          required: false
          description: Filter by collaboration requests that were created after (YYYY-MM-DDTHH:MM:SSZ)
          schema:
            type: string
            format: date-time
        - name: includeRemovedNotes
          in: query
          required: false
          description: Filter to include removed notes - excluded by default
          schema:
            type: boolean
            default: false
        - name: page
          in: query
          required: false
          description: Page number (0-based) for pagination when paginated is true
          schema:
            type: integer
            format: int32
            default: 0
            minimum: 0
        - name: size
          in: query
          required: false
          description: Page size for pagination when paginated is true (0 means return all records)
          schema:
            type: integer
            format: int32
            default: 0
            minimum: 0
            maximum: 500
        - name: paginated
          in: query
          required: false
          description: Set to 'true' to request paginated results instead of an array. If true, the updatedAfter and createdAfter filters are ignored.
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: List of collaboration requests or paginated response
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/CollaborationRequestListResponse"
                  - $ref: "#/components/schemas/PagedResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"

  /v2/collaboration-requests:
    get:
      tags:
        - Collaboration Requests
      summary: Get collaboration requests (paginated)
      operationId: getCollaborationRequestsPaginated
      parameters:
        - name: internalCaseNumber
          in: query
          required: false
          description: Your internal case number
          schema:
            type: string
        - name: type
          in: query
          required: false
          description: Filter by collaboration request type (optional) - all by default
          schema:
            $ref: "#/components/schemas/CollaborationRequestType"
        - name: status
          in: query
          required: false
          description: Filter by collaboration request status (optional) - all by default
          schema:
            $ref: "#/components/schemas/CollaborationRequestStatus"
        - name: includeRemovedNotes
          in: query
          required: false
          description: Include removed notes - excluded by default
          schema:
            type: boolean
            default: false
        - name: page
          in: query
          required: false
          description: Page number (0-based)
          schema:
            type: integer
            format: int32
            default: 0
            minimum: 0
        - name: size
          in: query
          required: false
          description: Page size (0 means return all records)
          schema:
            type: integer
            format: int32
            default: 25
            minimum: 0
            maximum: 500
      responses:
        "200":
          description: Paginated list of collaboration requests
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PagedResponse"
        "401":
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "403":
          description: Access denied
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"

  /v2/collaboration-requests/list:
    get:
      tags:
        - Collaboration Requests
      summary: List collaboration requests
      operationId: listCollaborationRequests
      parameters:
        - name: internalCaseNumber
          in: query
          required: false
          description: Your internal case number
          schema:
            type: string
        - name: type
          in: query
          required: false
          description: Filter by collaboration request type (optional) - all by default
          schema:
            $ref: "#/components/schemas/CollaborationRequestType"
        - name: status
          in: query
          required: false
          description: Filter by collaboration request status (optional) - all by default
          schema:
            $ref: "#/components/schemas/CollaborationRequestStatus"
        - name: updatedAfter
          in: query
          required: false
          description: Filter by requests updated after (YYYY-MM-DDTHH:MM:SSZ)
          schema:
            type: string
            format: date-time
        - name: createdAfter
          in: query
          required: false
          description: Filter by requests created after (YYYY-MM-DDTHH:MM:SSZ)
          schema:
            type: string
            format: date-time
        - name: includeRemovedNotes
          in: query
          required: false
          description: Include removed notes - excluded by default
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: List of collaboration requests
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CollaborationRequestListResponse"
        "401":
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "403":
          description: Access denied
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"

  /v1/collaboration-requests/{token}:
    get:
      tags:
        - Collaboration Requests
      summary: Get a specific collaboration request by token
      operationId: getCollaborationRequestByToken
      parameters:
        - name: token
          in: path
          required: true
          description: The token provided by TSANet for the collaboration request
          schema:
            type: string
        - name: includeRemovedNotes
          in: query
          required: false
          description: Filter to include removed notes - excluded by default
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: Collaboration request details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CollaborationRequestStatusDTO"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "403":
          description: Access denied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "404":
          description: Collaboration request not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"

    patch:
      tags:
        - Collaboration Requests
      summary: Update collaboration request submitter details
      operationId: updateCollaborationRequestSubmitter
      parameters:
        - name: token
          in: path
          required: true
          description: The token provided by TSANet for the collaboration request
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema:
              $ref: "#/components/schemas/CollaborationRequestSubmitterUpdateDTO"
          application/json:
            schema:
              $ref: "#/components/schemas/CollaborationRequestSubmitterUpdateDTO"
      responses:
        "200":
          description: Collaboration request updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CollaborationRequestStatusDTO"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "403":
          description: Access denied - only the submitter can update these details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "404":
          description: Collaboration request not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"

  # Case Response endpoints
  /v1/collaboration-requests/{token}/approval:
    post:
      tags:
        - Case Responses
      summary: Approve a collaboration request
      operationId: approveCollaborationRequest
      parameters:
        - name: token
          in: path
          required: true
          description: The token provided by TSANet for the collaboration request
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CaseApprovalDTO"
      responses:
        "200":
          description: Collaboration request approved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CollaborationRequestStatusDTO"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "403":
          description: Access denied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"

    patch:
      tags:
        - Case Responses
      summary: Update an approved collaboration request
      operationId: updateApproval
      parameters:
        - name: token
          in: path
          required: true
          description: The token provided by TSANet for the collaboration request
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema:
              $ref: "#/components/schemas/CaseApprovalUpdateDTO"
          application/json:
            schema:
              $ref: "#/components/schemas/CaseApprovalUpdateDTO"
      responses:
        "200":
          description: Collaboration request approval updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CollaborationRequestStatusDTO"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"

  /v1/collaboration-requests/{token}/information-request:
    post:
      tags:
        - Case Responses
      summary: Submit an information request
      operationId: submitInformationRequest
      parameters:
        - name: token
          in: path
          required: true
          description: The token provided by TSANet for the collaboration request
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CaseInformationRequestDTO"
      responses:
        "200":
          description: Information request submitted successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CollaborationRequestStatusDTO"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"

  /v1/collaboration-requests/{token}/information-response:
    post:
      tags:
        - Case Responses
      summary: Submit an information response
      operationId: submitInformationResponse
      parameters:
        - name: token
          in: path
          required: true
          description: The token provided by TSANet for the collaboration request
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CaseInformationResponseDTO"
      responses:
        "200":
          description: Information response submitted successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CollaborationRequestStatusDTO"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"

  /v1/collaboration-requests/{token}/rejection:
    post:
      tags:
        - Case Responses
      summary: Reject a collaboration request
      operationId: rejectCollaborationRequest
      parameters:
        - name: token
          in: path
          required: true
          description: The token provided by TSANet for the collaboration request
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CaseRejectionDTO"
      responses:
        "200":
          description: Collaboration request rejected successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CollaborationRequestStatusDTO"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"

  /v1/collaboration-requests/{token}/closure:
    post:
      tags:
        - Case Responses
      summary: Close a collaboration request
      operationId: closeCollaborationRequest
      parameters:
        - name: token
          in: path
          required: true
          description: The token provided by TSANet for the collaboration request
          schema:
            type: string
      responses:
        "200":
          description: Collaboration request closed successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CollaborationRequestStatusDTO"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"

  # Notes endpoints
  /v1/collaboration-requests/{token}/notes:
    post:
      tags:
        - Case Notes
      summary: Create a note for a collaboration request
      operationId: createNote
      parameters:
        - name: token
          in: path
          required: true
          description: The token provided by TSANet for the collaboration request
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CaseNoteTemplateDTO"
      responses:
        "200":
          description: Note created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaseNoteDTO"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"

    get:
      tags:
        - Case Notes
      summary: Get notes for a collaboration request
      operationId: getNotes
      parameters:
        - name: token
          in: path
          required: true
          description: The token provided by TSANet for the collaboration request
          schema:
            type: string
        - name: updatedAfter
          in: query
          required: false
          description: Filter by notes that were updated after (YYYY-MM-DDTHH:MM:SSZ)
          schema:
            type: string
            format: date-time
        - name: createdAfter
          in: query
          required: false
          description: Filter by notes that were created after (YYYY-MM-DDTHH:MM:SSZ)
          schema:
            type: string
            format: date-time
        - name: includeRemoved
          in: query
          required: false
          description: Filter to include removed notes - excluded by default
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: List of notes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CaseNoteDTO"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"

  # Attachment endpoints
  /v1/collaboration-requests/{token}/attachments/config:
    get:
      tags:
        - Case Attachments
      summary: Get attachment configuration for a collaboration request
      operationId: getAttachmentConfig
      parameters:
        - name: token
          in: path
          required: true
          description: The token provided by TSANet for the collaboration request
          schema:
            type: string
      responses:
        "200":
          description: Attachment configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttachmentConfigDTO"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"

  /v1/collaboration-requests/{token}/attachments/config/https/analyze:
    post:
      tags:
        - Case Attachments
      summary: Analyze arbitrary data and return a proposed attachment configuration without saving it
      operationId: analyzeConfig
      parameters:
        - name: token
          in: path
          required: true
          description: The token provided by TSANet for the collaboration request
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "200":
          description: Proposed attachment configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NormalizedHttpsAttachmentConfigDTO"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"

  /v1/collaboration-requests/{token}/attachments/config/https:
    put:
      tags:
        - Case Attachments
      summary: Update HTTPS attachment configuration details
      operationId: createAttachmentConfig
      parameters:
        - name: token
          in: path
          required: true
          description: The token provided by TSANet for the collaboration request
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/NormalizedHttpsAttachmentConfigDTO"
        required: true
      responses:
        "200":
          description: Attachment configuration updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttachmentConfigDTO"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"

  /v1/collaboration-requests/{token}/attachments:
    post:
      tags:
        - Case Attachments
      summary: Forward attachments to collaboration partners
      operationId: forwardAttachment
      parameters:
        - name: token
          in: path
          required: true
          description: The token provided by TSANet for the collaboration request
          schema:
            type: string
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                description:
                  type: string
                  maxLength: 500
                  description: Description of the attachments
                files:
                  type: array
                  items:
                    type: string
                    format: binary
                  description: Files to forward
              required:
                - description
                - files
      responses:
        "200":
          description: Attachments forwarded successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AttachmentForwardResultDTO"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"

  # Partner search endpoints
  /v1/partners/{searchTerm}:
    get:
      tags:
        - Entity Search
      summary: Search for collaboration partners
      operationId: searchPartners
      parameters:
        - name: searchTerm
          in: path
          required: true
