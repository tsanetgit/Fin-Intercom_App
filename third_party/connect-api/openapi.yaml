        **Security**: Every delivery is signed with HMAC-SHA256. The signature is sent in the
        `X-Hub-Signature-256` header as `sha256=<hex>`. Verify it using the secret returned
        on subscription creation (rotate via `POST /v1/webhooks/{id}/secret`).

        **Retries**: Failed deliveries are retried up to 4 additional times (5 total attempts)
        with exponential backoff starting at 10s, doubling each attempt, capped at 300s.
