  # Webhook endpoints
  /v2/webhooks:
    post:
      tags:
        - WebhooksV2
      summary: Register a new V2 webhook subscription (CloudEvents)
      description: |
        Subscribe to receive CloudEvents 1.0 structured webhook notifications. Connect 2 will POST 
        event types to your callback URL.

        Use `eventTypes` to filter which events you receive. Event type strings must match the
        CloudEvent `type` field exactly as it appears in delivered payloads (e.g.
        `org.tsanet.connect.collaboration-request.created`).

        **Security**: Every delivery is signed with HMAC-SHA256. The signature is sent in the
        `X-Hub-Signature-256` header as `sha256=<hex>`. Verify it using the secret returned
        on subscription creation (rotate via `POST /v1/webhooks/{id}/secret`).

        **Retries**: Failed deliveries are retried up to 4 additional times (5 total attempts)
        with exponential backoff starting at 10s, doubling each attempt, capped at 300s.
        Messages that exhaust all retries are moved to a dead-letter queue. Contact TSANet
        support to replay dead-lettered deliveries.
      operationId: createWebhookSubscriptionV2
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateWebhookSubscriptionV2RequestDTO"
      responses:
        "200":
          description: Webhook subscription created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookSubscriptionV2ResponseDTO"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"

